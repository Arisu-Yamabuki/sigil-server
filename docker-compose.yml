services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  sigil:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/sigil
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mongo
volumes:
  mongo-data:
