# coturn: relay for calls behind strict NATs. Install: sudo pacman -S coturn (or apt install coturn)
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_SAME_VALUE_AS_TURN_SECRET
realm=sigil.adnand.com
cert=/etc/letsencrypt/live/sigil.adnand.com/fullchain.pem
pkey=/etc/letsencrypt/live/sigil.adnand.com/privkey.pem
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Never relay to private or loopback addresses
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
min-port=49160
max-port=49200
no-cli
